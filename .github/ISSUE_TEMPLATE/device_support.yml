name: Device support request
description: Request/test support for another MOVA energy product
title: "[Device]: "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for other MOVA energy-storage products. Do not post credentials, tokens, cookies, addresses or personal device identifiers.

  - type: input
    id: product
    attributes:
      label: MOVA product name
      placeholder: "Product/model name"
    validations:
      required: true

  - type: input
    id: model_id
    attributes:
      label: Model ID (if safely known)
      description: Only provide this if it is a generic product/model ID, not a unique serial/device ID.

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
    validations:
      required: true

  - type: textarea
    id: behavior
    attributes:
      label: What do you see in MOVAhome / Home Assistant?
      description: Describe behavior without pasting private cloud responses or identifiers.
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included credentials, tokens, cookies, addresses or unique personal device identifiers.
          required: true
