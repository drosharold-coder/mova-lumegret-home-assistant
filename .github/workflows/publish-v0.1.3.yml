name: Publish v0.1.3

on:
  push:
    paths:
      - '.github/release-v0.1.3-trigger'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    if: github.repository == 'drosharold-coder/mova-lumegret-home-assistant'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Build installation ZIP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          out = Path('MOVA_Home_Assistant_v0.1.3.zip')
          include_roots = [Path('custom_components/mova_lumegret')]
          optional = Path('optional/mova_energy_dashboard.yaml')

          with ZipFile(out, 'w', ZIP_DEFLATED) as z:
              for root in include_roots:
                  for path in sorted(root.rglob('*')):
                      if path.is_file():
                          z.write(path, path.as_posix())
              if optional.exists():
                  z.write(optional, optional.as_posix())
              for extra in [Path('README.md'), Path('README_NL.md'), Path('LICENSE')]:
                  if extra.exists():
                      z.write(extra, extra.as_posix())
          print(f'Created {out} ({out.stat().st_size} bytes)')
          PY

      - name: Publish v0.1.3
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.3 >/dev/null 2>&1; then
            echo 'Release v0.1.3 already exists; nothing to do.'
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## MOVA LumeGret Energy v0.1.3

          First public community release of the unofficial read-only Home Assistant integration for MOVA LumeGret A4000 and MOVA Smart Meter P1.

          ### Included
          - A4000 battery telemetry
          - Smart Meter P1 grid import/export telemetry
          - English and Dutch translations
          - HACS custom-repository structure
          - Optional Home Assistant Energy Dashboard package
          - Read-only safety guard
          - HACS and Home Assistant validation workflows

          ### Safety
          This public release is read-only. It does not contain battery charge/discharge commands, experimental MOVA write control, private IP addresses, account tokens, cookies or personal device identifiers.

          This is a community project and is not an official MOVA or Home Assistant integration. Cloud or firmware changes may require future compatibility updates.
          EOF

          gh release create v0.1.3 \
            MOVA_Home_Assistant_v0.1.3.zip \
            --target "$GITHUB_SHA" \
            --title 'MOVA LumeGret Energy v0.1.3' \
            --notes-file /tmp/release-notes.md
